services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      echo 'bucket ${S3_BUCKET} ready';
      "
    restart: "no"

  flink-jobmanager:
    build: ./flink-jobs
    image: cogniguard-flink:1.18
    command: jobmanager
    ports: ["8081:8081"]
    env_file: [.env]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    volumes: ["./flink-jobs:/jobs"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  flink-taskmanager:
    build: ./flink-jobs
    image: cogniguard-flink:1.18
    command: taskmanager
    env_file: [.env]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes: ["./flink-jobs:/jobs"]
    depends_on:
      flink-jobmanager: { condition: service_started }

  gateway:
    build: ./gateway
    env_file: [.env]
    ports: ["8000:8000"]
    volumes:
      - "./gateway:/app"          # dev: live source + alembic autogenerate output
      - "./flink-jobs:/flink-jobs:ro"   # dev: run windows/sinks unit tests here
      - "./training:/app/training"     # dev: offline training scripts (Phase 5+)
      - "./models:/models"
      - "./SAMPLE_DATA:/data/sample:ro"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }

  # --- UI services join in Phase 11; start with:  docker compose --profile ui up --build ---
  web-app:
    profiles: ["ui"]
    # Context widened to the repo root (not ./web-app) so the Dockerfile can COPY
    # behavior-sdk/ and build it before `npm install` resolves web-app's
    # `file:../behavior-sdk` dependency -- that package ships compiled dist/, not
    # source, and dist/ wouldn't be reachable from a ./web-app-scoped context.
    build:
      context: .
      dockerfile: web-app/Dockerfile
    env_file: [.env]
    ports: ["5173:5173"]
    depends_on: [gateway]

  bank-dashboard:
    profiles: ["ui"]
    build: ./bank-dashboard
    env_file: [.env]
    ports: ["5174:5174"]
    depends_on: [gateway]

volumes:
  pgdata:
  minio-data:
