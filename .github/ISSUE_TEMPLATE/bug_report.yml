name: Bug Report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Run `docker compose up`
        2. Call `POST /api/v1/auth/login` with ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Include error messages, stack traces, or HTTP responses.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway (FastAPI)
        - flink-jobs (feature engine)
        - training (ML models)
        - web-app (React)
        - bank-dashboard (React)
        - behavior-sdk (TypeScript)
        - android (Kotlin)
        - docker-compose / infra
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11 / macOS 14 / Ubuntu 22.04
        Docker: 24.x
        Python: 3.11.x
        Node: 20.x
