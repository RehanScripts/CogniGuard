name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What is currently missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you evaluated.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway (FastAPI)
        - flink-jobs (feature engine)
        - training (ML models)
        - web-app (React)
        - bank-dashboard (React)
        - behavior-sdk (TypeScript)
        - android (Kotlin)
        - docker-compose / infra
        - other
    validations:
      required: true
