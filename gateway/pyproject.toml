[project]
name = "cogniguard-gateway"
version = "0.1.0"
description = "CogniGuard API Gateway + scoring + decision engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "confluent-kafka>=2.3",
  "boto3>=1.34",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "onnxruntime>=1.17",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "joblib>=1.3",
  "pyarrow>=15.0",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4", "black>=24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
